name: Verify task operations dark UI
on:
  push:
    branches: [work/task-operations-dark-ui-20261011]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test test/taskOperationDialogUI.test.js test/userGuideAssets.test.js test/sidePanelElementActionsContract.test.js
      - run: npm run build:release
      - run: npm run build:pages
