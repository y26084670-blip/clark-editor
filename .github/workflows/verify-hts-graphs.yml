name: Verify HTS graphs

on:
  pull_request:
    paths:
      - 'src/components/materials/HtsGraphRegion.*'
      - 'src/services/materials/htsGraphModel.js'
      - 'src/services/solver/htsMaterialLaw.js'
      - 'test/htsGraphModel.test.js'
      - 'test/htsMaterialLaw.test.js'
      - 'test/browser/htsGraphs.fixture.jsx'
      - 'scripts/check-hts-graphs-browser.mjs'
      - 'package*.json'
      - '.github/workflows/verify-hts-graphs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check material laws and graph models
        run: node --test test/htsMaterialLaw.test.js test/htsGraphModel.test.js
      - name: Prepare application assets
        run: npm run assets:prepare
      - name: Install browser testing tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Check real HTS chart controls and logarithmic axes
        run: node scripts/check-hts-graphs-browser.mjs
      - name: Save chart verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hts-graph-browser-evidence
          path: /tmp/editor-hts-graphs
          if-no-files-found: ignore
          retention-days: 7
