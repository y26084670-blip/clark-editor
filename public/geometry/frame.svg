<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650"><rect width="900" height="650" fill="white"/><g font-family="sans-serif" fill="#203442"><text x="40" y="35" font-size="23">A — замкнутый магнитопровод; B — отдельный магнит</text><text x="40" y="67" font-size="18">Вид Y–Z; оба тела: −10 ≤ X ≤ 10 мм. Размеры в мм.</text><path d="M150 520H750V120H150Z M250 220H650V420H250Z" fill="#c5dce6" fill-rule="evenodd" stroke="#274e62" stroke-width="3"/><rect x="350" y="295" width="200" height="50" fill="#f0bd82" stroke="#a75d23" stroke-width="3"/><g font-size="20"><text x="430" y="176">A</text><text x="432" y="326">B</text><text x="426" y="555">120</text><text x="100" y="330">80</text><text x="430" y="448">80</text><text x="660" y="330">40</text><text x="425" y="285">40</text><text x="558" y="328">10</text><text x="275" y="248">Окно сквозное по X</text><text x="40" y="596">Начало — общий центр. Окно и B расположены по центру.</text><text x="40" y="625">+Y →; +Z ↑; +X к наблюдателю. B не касается A.</text></g></g></svg>